# GlazeBoot settings (docs/GLAZEBOOT.md). Keep this file next to
# GlazeBoot.exe, kernel.bin and romfs.img.

# The files to load, in this folder.
kernel=kernel.bin
romfs=romfs.img

# Size of the RAM disk Glaze's / lives on, lost on reset (128-11264).
ramfs_kb=2048

# Windows CE's FAT volume in the NAND as /NAND: off, ro or rw. rw doesn't
# yet write Windows CE's spare-area tags and ECC, so it can damage the volume
# Windows CE boots from.
nand=ro

# Ask before handing over (1), or start at once (0).
confirm=1

# With confirm=1, boot by itself after this many seconds unless Cancel is
# tapped; 0 waits for Boot or Cancel.
countdown=10

# boot, or probe: check what the hand-over needs, write glazeboot.log, and
# return to Windows CE.
mode=boot
