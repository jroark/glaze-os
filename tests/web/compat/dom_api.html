<script>
  var out = [], box = document.getElementById('box'), leaf = document.getElementById('leaf');

                               return box.className + '/' + box.classList.length + box.classList.contains('e'); });

                            box.dispatchEvent(new CustomEvent('ping', { detail: { n: 7 } }));
                            var old = document.createEvent('Event'); old.initEvent('pong', true, true); return got + old.type + (new MouseEvent('click', { clientX: 5 })).clientX; });

  t('geometry', function () { box.hidden = false; return (box.offsetWidth > 0) + '' + (leaf.offsetHeight > 0) + (document.documentElement.scrollHeight > 0) + leaf.getClientRects().length; });
  t('doc', function () { return document.compatMode + document.visibilityState + document.hidden + (document.activeElement === document.body) + document.hasFocus(); });
  setTimeout("out.push('strtimer=ok')", 5);

  setTimeout(function () { out.forEach(function (l) { console.log('api ' + l); }); }, 60);
